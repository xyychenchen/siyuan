name: Compare native UI failures with upstream
on:
  push:
    branches: [master]
    paths: ['.github/workflows/selfhost-baseline.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Prepare upstream baseline and sandbox
        run: |
          cd app
          node -e "require('electron')"
          sandbox=$(node -p "require('path').join(require('path').dirname(require.resolve('electron')), 'dist', 'chrome-sandbox')")
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          cd ..
          git fetch --depth=1 origin d3af9d5782082b379d45a69eedf4ebcfe8ba6889
          git worktree add --detach "$RUNNER_TEMP/upstream" d3af9d5782082b379d45a69eedf4ebcfe8ba6889
          ln -s "$GITHUB_WORKSPACE/app/node_modules" "$RUNNER_TEMP/upstream/app/node_modules"
      - name: Recheck the two native UI failure candidates in isolation
        run: |
          set +e
          cd app
          xvfb-run -a node --import tsx --test --test-concurrency=1 src/layout/dock/BottomBacklinkPanel.test.ts src/protyle/render/listMindmap/model.test.ts > "$GITHUB_WORKSPACE/current-native.log" 2>&1
          echo "Current candidate-test exit: $?"
          cd "$RUNNER_TEMP/upstream/app"
          xvfb-run -a node --import tsx --test --test-concurrency=1 src/layout/dock/BottomBacklinkPanel.test.ts src/protyle/render/listMindmap/model.test.ts > "$GITHUB_WORKSPACE/upstream-native.log" 2>&1
          echo "Upstream candidate-test exit: $?"
      - name: Reject additional failures relative to upstream
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          reports = {}
          for name in ['current', 'upstream']:
              text = Path(name + '-native.log').read_text()
              assert re.search(r'ℹ tests \d+', text), name + ' test runner did not finish'
              failures = {line[2:].rsplit(' (', 1)[0] for line in text.splitlines() if line.startswith('✖ ')}
              reports[name] = failures
              print(name + ' failures:', sorted(failures))
              print('\n'.join(line for line in text.splitlines() if line.startswith(('ℹ tests', 'ℹ pass', 'ℹ fail', 'ℹ skipped'))))
          assert reports['current'] <= reports['upstream'], 'Modified fork has additional native test failures'
          print('ISOLATED_NATIVE_CANDIDATES_HAVE_NO_ADDITIONAL_FAILURES_VS_UPSTREAM')
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-upstream-comparison
          path: '*-native.log'
