name: Publish self-hosted test artifacts
on:
  push:
    branches: [master]
    paths: ['.github/workflows/selfhost-release.yml']
  workflow_run:
    workflows: [Self-hosted SiYuan test builds]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v7
        if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'failure'
        with:
          name: selfhost-regression-log
          path: regression-report
          run-id: ${{ github.event.workflow_run.id || 41281349799 }}
          github-token: ${{ github.token }}
      - name: Limit exceptions to the two compared native UI cases
        if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'failure'
        run: |
          python3 - <<'PYKNOWN'
          import re
          from pathlib import Path
          text = Path('regression-report/selfhost-tests.log').read_text()
          failures = {line[2:].rsplit(' (', 1)[0] for line in text.splitlines() if line.startswith('✖ ') and ' (' in line}
          assert failures == {
              'bottom backlinks preserve lazy loading, visibility, cleanup and mobile scrolling',
              'list mindmap mutations preserve block data in the real DOM and Lute',
          }, failures
          assert re.search(r'ℹ fail 2(?:\n|$)', text)
          PYKNOWN
      - name: Require all build jobs and an upstream comparison for known UI failures
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id || 41281349799 }}
          BUILD_RESULT: ${{ github.event.workflow_run.conclusion || 'failure' }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" > jobs.json
          python3 - <<'PYJOBS'
          import json
          jobs = {job['name']: job['conclusion'] for job in json.load(open('jobs.json'))['jobs']}
          assert all(jobs.get(name) == 'success' for name in ['ui', 'kernel', 'android']), jobs
          PYJOBS
          if [ "$BUILD_RESULT" = failure ]; then
            test "$BUILD_RUN" = 41281349799
            verified=false
            for attempt in $(seq 1 20); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=550b67970bbe5eb78628a1cda3e5f75597e2b8a7" > comparison-runs.json
              if python3 - <<'PYCOMPARE'
          import json
          runs = json.load(open('comparison-runs.json'))['workflow_runs']
          assert any(r['path'] == '.github/workflows/selfhost-baseline.yml' and r['conclusion'] == 'success' for r in runs)
          PYCOMPARE
              then verified=true; break; fi
              sleep 15
            done
            test "$verified" = true
          fi
      - uses: actions/download-artifact@v7
        with:
          name: selfhost-ui
          path: dist
          run-id: ${{ github.event.workflow_run.id || 41281349799 }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: selfhost-linux-amd64
          path: dist
          run-id: ${{ github.event.workflow_run.id || 41281349799 }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v7
        with:
          name: siyuan-selfhost-android-arm64-test
          path: dist
          run-id: ${{ github.event.workflow_run.id || 41281349799 }}
          github-token: ${{ github.token }}
      - name: Publish matching test build with checksums
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha || 'de7130c21da5c62090829cb377ee03d99f97bdb2' }}
          BUILD_URL: ${{ github.event.workflow_run.html_url || 'https://github.com/xyychenchen/siyuan/actions/runs/41281349799' }}
        run: |
          set -euo pipefail
          [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]
          tag="selfhost-test-${BUILD_SHA:0:12}"
          (cd dist && sha256sum * > SHA256SUMS)
          printf 'Unofficial personal test build. Source commit: %s\n\nBuild and tests: %s\n\nThis is a test release. Inspect the run: the broad affected suite may include existing native UI failures; if so, publication requires a separate comparison against the unchanged upstream baseline. This does not mean every test passed.\n\nAGPL-3.0-or-later. Uses the official SiYuan interface and existing encrypted sync engine. Self-hosted S3/WebDAV/local sync does not require a SiYuan account; official cloud still requires a subscription.\n\nAndroid ARM64, Android 8+. Debug application ID org.b3log.siyuan.debug. CI debug signing is temporary; back up local workspaces before replacing test APKs. Device/offline/conflict testing is still required.\n' "$BUILD_SHA" "$BUILD_URL" > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --prerelease --title "Self-hosted test ${BUILD_SHA:0:12}" --notes-file notes.md
          fi
